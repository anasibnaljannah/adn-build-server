name: build-apk
run-name: build ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id: { description: "Job id (32 hex chars)", required: true }
      release_id: { description: "Draft release id holding input.zip", required: true }
      file_name: { description: "Original zip file name (used as app name)", required: false, default: "app.zip" }

concurrency: { group: "job-${{ inputs.job_id }}" }
permissions: { contents: read }

jobs:
  # 1) Untrusted build: no secrets, read-only token, no persisted git credentials.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs: { kind: "${{ steps.detect.outputs.kind }}" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Download input.zip from release
        env: { GH_TOKEN: "${{ github.token }}", ID: "${{ inputs.job_id }}", RID: "${{ inputs.release_id }}" }
        run: |
          [[ "$ID" =~ ^[0-9a-f]{32}$ && "$RID" =~ ^[0-9]+$ ]] || { echo "bad job id"; exit 1; }
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID")
          [ "$(jq -r .tag_name <<<"$rel")" = "job-$ID" ] || { echo "release/job mismatch"; exit 1; }
          aid=$(jq -r '.assets[] | select(.name=="input.zip") | .id' <<<"$rel")
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$aid" -o "$RUNNER_TEMP/input.zip"
          size=$(stat -c %s "$RUNNER_TEMP/input.zip"); [ "$size" -le 52428800 ] || { echo "file larger than 50 MB" > error.txt; exit 1; }
      - id: detect
        name: Detect project type
        run: |
          python3 ci/build.py detect "$RUNNER_TEMP/input.zip" "$RUNNER_TEMP/w" > kind.out
          echo "kind=$(tail -1 kind.out)" >> "$GITHUB_OUTPUT"; cat kind.out
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ contains(fromJSON('[\"capacitor\",\"cordova\",\"react-native\",\"flutter\"]'), steps.detect.outputs.kind) && '21' || '17' }}" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9", cache-disabled: true }
      - if: steps.detect.outputs.kind == 'flutter'
        uses: subosito/flutter-action@v2
        with: { channel: stable }
      - if: contains(fromJSON('["capacitor","cordova","react-native"]'), steps.detect.outputs.kind)
        uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build (unsigned)
        env: { NAME: "${{ inputs.file_name }}", GITHUB_TOKEN: "" }
        run: python3 ci/build.py build "$RUNNER_TEMP/w" "$NAME" "$RUNNER_TEMP/unsigned.apk"
      - uses: actions/upload-artifact@v4
        with: { name: unsigned, path: "${{ runner.temp }}/unsigned.apk", retention-days: 1 }
      - if: failure()
        run: '[ -f error.txt ] || echo "build failed (see the Actions log for details)" > error.txt'
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: error, path: error.txt, retention-days: 1 }

  # 2) Trusted signing on a fresh runner.
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: unsigned, path: in }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Sign and publish
        env:
          GH_TOKEN: "${{ github.token }}"
          RID: "${{ inputs.release_id }}"
          KS_B64: "${{ secrets.SIGNING_KEYSTORE_B64 }}"
          KS_PASS: "${{ secrets.SIGNING_PASSWORD }}"
          KS_ALIAS: "${{ secrets.SIGNING_ALIAS || 'srv' }}"
        run: |
          export KEYSTORE="$RUNNER_TEMP/ks.jks"
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$KEYSTORE"
          else
            echo "::warning::No SIGNING_KEYSTORE_B64 secret: using a one-time key (APKs cannot be updated in place)"
            export KS_PASS=$(openssl rand -hex 16) KS_ALIAS=srv
            keytool -genkeypair -keystore "$KEYSTORE" -alias srv -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Adn Build (ephemeral)"
          fi
          python3 ci/build.py sign in/unsigned.apk app.apk
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @app.apk "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=app.apk" > /dev/null

  # 3) Report failure so the relay can show it.
  report-failure:
    needs: [build, sign]
    if: failure()
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: error }
        continue-on-error: true
      - env: { GH_TOKEN: "${{ github.token }}", RID: "${{ inputs.release_id }}" }
        run: |
          [ -f error.txt ] || echo "build failed" > error.txt
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @error.txt "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=error.txt" > /dev/null
